<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arvino — Cross-Project Cycle & Roadmap</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d2991d;
    --orange: #d2991d;
    --purple: #a371f7;
    --pink: #db61a2;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.ok { background: var(--green); }
  .status-dot.err { background: var(--red); }
  .status-dot.loading { background: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .btn {
    background: var(--border); color: var(--text); border: none;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { background: #484f58; }
  .btn.active { background: var(--accent); color: #000; font-weight: 600; }

  /* Summary bar */
  .summary-bar {
    display: flex;
    gap: 16px;
    padding: 16px 24px;
    flex-wrap: wrap;
  }
  .metric-card {
    flex: 1;
    min-width: 140px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .metric-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .metric-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .metric-card .value.green { color: var(--green); }
  .metric-card .value.red { color: var(--red); }
  .metric-card .value.yellow { color: var(--yellow); }
  .metric-card .value.accent { color: var(--accent); }

  /* View toggle */
  .view-toggle {
    display: flex;
    gap: 4px;
    padding: 0 24px 12px;
  }

  /* Timeline */
  .timeline-section {
    padding: 0 24px 16px;
  }
  .project-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .project-block-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .project-block-header:hover { background: #1c2129; }
  .project-name { font-weight: 600; font-size: 14px; }
  .project-stats { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  .project-stats span { display: flex; align-items: center; gap: 4px; }
  .project-progress {
    height: 3px;
    background: var(--border);
    margin-top: 0;
  }
  .project-progress-fill {
    height: 100%;
    background: var(--green);
    transition: width 0.5s ease;
  }
  .project-progress-fill.has-blocks { background: var(--yellow); }
  .project-progress-fill.has-fails { background: var(--red); }

  .run-timeline {
    padding: 8px 16px;
    overflow-x: auto;
  }
  .run-row {
    display: flex;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #1c2129;
    font-size: 13px;
    gap: 12px;
  }
  .run-row:last-child { border-bottom: none; }
  .run-name { flex: 1; min-width: 140px; font-weight: 500; }
  .run-name small { color: var(--muted); display: block; font-weight: 400; font-size: 11px; }
  .run-bar-container {
    flex: 3;
    height: 20px;
    background: #1c2129;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    min-width: 200px;
  }
  .run-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s ease;
    position: relative;
  }
  .run-bar.ok { background: var(--green); }
  .run-bar.running { background: var(--accent); background-image: linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.1) 75%, transparent 75%, transparent); background-size: 20px 20px; animation: barber 1s linear infinite; }
  .run-bar.blocked { background: var(--yellow); }
  .run-bar.failed { background: var(--red); }
  .run-bar.pending { background: #484f58; }
  @keyframes barber { 0% { background-position: 0 0; } 100% { background-position: 20px 0; } }
  .run-bar-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; padding: 0 8px;
    font-size: 11px; font-weight: 500;
  }
  .run-status { min-width: 80px; text-align: right; }
  .run-time { min-width: 70px; text-align: right; color: var(--muted); font-size: 11px; }

  /* Blockers section */
  .blockers-section {
    padding: 0 24px 16px;
  }
  .blockers-section h2 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .blocker-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
  }
  .blocker-card.warn { border-left-color: var(--yellow); }
  .blocker-project { font-weight: 600; min-width: 120px; }
  .blocker-run { flex: 1; }
  .blocker-reason { color: var(--muted); flex: 2; font-size: 12px; }
  .blocker-time { color: var(--muted); font-size: 11px; min-width: 80px; text-align: right; }

  /* Cycle table */
  .cycle-section {
    padding: 0 24px 16px;
  }
  .cycle-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cycle-table th {
    text-align: left; color: var(--muted); font-weight: 500;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface);
  }
  .cycle-table td { padding: 8px 12px; border-bottom: 1px solid #1c2129; }
  .cycle-table tr:hover { background: #1c2129; }

  /* Badges */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 11px; font-weight: 500;
  }
  .badge.ok { background: #1a3a2a; color: var(--green); }
  .badge.warn { background: #3a2e1a; color: var(--yellow); }
  .badge.err { background: #3a1a1a; color: var(--red); }
  .badge.info { background: #1a2a3a; color: var(--accent); }
  .badge.purple { background: #2a1a3a; color: var(--purple); }

  /* Empty state */
  .empty { color: var(--muted); text-align: center; padding: 32px; font-size: 13px; }

  /* Auth modal — identical to dashboard */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw;
  }
  .modal h2 { font-size: 16px; margin-bottom: 8px; }
  .modal p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal input {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    background: #0d1117; color: var(--text);
    font-size: 14px; font-family: monospace; margin-bottom: 12px;
  }
  .modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
  .modal .hint { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .modal .error-msg { color: var(--red); font-size: 12px; margin-bottom: 8px; display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Auth Modal -->
<div id="auth-modal" class="modal-overlay">
  <div class="modal">
    <h2>Arvino API Authentication</h2>
    <p>Enter your Bearer token to connect to the Arvino API at <code>arvino.k8shome.com</code>.</p>
    <div class="hint">Get your token from the Arvino platform settings.</div>
    <input id="token-input" type="password" placeholder="Bearer token..." autocomplete="off">
    <div id="auth-error" class="error-msg"></div>
    <div class="btn-row">
      <button class="btn" onclick="document.getElementById('token-input').value='';document.getElementById('auth-error').style.display='none';">Clear</button>
      <button class="btn" onclick="saveToken()" style="background:var(--green);color:#000;font-weight:600;">Connect</button>
    </div>
  </div>
</div>

<!-- Header -->
<div class="header">
  <h1>&#9670; Arvino — Cycle &amp; Roadmap</h1>
  <div class="header-right">
    <span><span id="conn-dot" class="status-dot loading"></span><span id="conn-status">Initializing</span></span>
    <span id="last-refresh"></span>
    <button class="btn" onclick="changeToken()">Change Token</button>
    <button class="btn" onclick="refreshAll()" style="background:var(--accent);color:#000;font-weight:600;">Refresh</button>
  </div>
</div>

<!-- Summary -->
<div class="summary-bar" id="summary-bar"></div>

<!-- View Toggle -->
<div class="view-toggle">
  <button class="btn active" id="btn-timeline" onclick="switchView('timeline')">Roadmap Timeline</button>
  <button class="btn" id="btn-cycle" onclick="switchView('cycle')">Cycle View</button>
</div>

<!-- Timeline View -->
<div id="view-timeline">
  <div class="timeline-section" id="timeline-content"><div class="empty">Loading...</div></div>
  <div class="blockers-section" id="blockers-content"></div>
</div>

<!-- Cycle View -->
<div id="view-cycle" class="hidden">
  <div class="cycle-section" id="cycle-content"><div class="empty">Loading...</div></div>
</div>

<script>
const API_BASE = window.location.origin;
const REFRESH_INTERVAL = 10000;
let currentView = 'timeline';
let allData = { projects: [], runs: [] };

// ── Token management ──
function getToken() { return localStorage.getItem('arvino_token'); }

function saveToken() {
  const token = document.getElementById('token-input').value.trim();
  if (!token) return;
  probeToken(token).then(valid => {
    if (valid) {
      localStorage.setItem('arvino_token', token);
      document.getElementById('auth-modal').style.display = 'none';
      refreshAll();
    } else {
      document.getElementById('auth-error').textContent = 'Connection failed. Check your token and try again.';
      document.getElementById('auth-error').style.display = 'block';
    }
  });
}

async function probeToken(token) {
  try {
    const res = await fetch(`${API_BASE}/projects`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    return res.ok;
  } catch { return false; }
}

function changeToken() {
  localStorage.removeItem('arvino_token');
  document.getElementById('token-input').value = '';
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-modal').style.display = 'flex';
}

// ── API ──
async function apiFetch(path) {
  const token = getToken();
  if (!token) throw new Error('No token');
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── Normalize ──
function toArray(v) { return Array.isArray(v) ? v : (v?.items || v?.data || []); }
function field(obj, ...candidates) {
  const keys = Object.keys(obj || {});
  for (const c of candidates) {
    const found = keys.find(k => new RegExp(c, 'i').test(k));
    if (found) return obj[found];
  }
  return null;
}

// ── Status helpers ──
function classifyStatus(s) {
  const v = (s || '').toLowerCase();
  if (/success|complete|passed|done|ok/.test(v)) return 'ok';
  if (/fail|error|abort|cancel/.test(v)) return 'failed';
  if (/pending|waiting|queued/.test(v)) return 'pending';
  if (/running|active|progress/.test(v)) return 'running';
  if (/block|stuck/.test(v)) return 'blocked';
  return 'unknown';
}

function statusBadge(s) {
  const cls = classifyStatus(s);
  const map = { ok: 'ok', running: 'info', failed: 'err', pending: 'warn', blocked: 'err', unknown: 'purple' };
  return `<span class="badge ${map[cls] || 'purple'}">${esc(s)}</span>`;
}

function pill(s) {
  const cls = classifyStatus(s);
  const labels = { ok: 'Done', running: 'Running', failed: 'Failed', pending: 'Pending', blocked: 'Blocked', unknown: s };
  const map = { ok: 'ok', running: 'info', failed: 'err', pending: 'warn', blocked: 'err', unknown: 'purple' };
  return `<span class="badge ${map[cls] || 'purple'}">${labels[cls]}</span>`;
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const diff = Math.floor((Date.now() - d) / 1000);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return d.toLocaleDateString();
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── View switching ──
function switchView(view) {
  currentView = view;
  document.getElementById('btn-timeline').classList.toggle('active', view === 'timeline');
  document.getElementById('btn-cycle').classList.toggle('active', view === 'cycle');
  document.getElementById('view-timeline').classList.toggle('hidden', view !== 'timeline');
  document.getElementById('view-cycle').classList.toggle('hidden', view !== 'cycle');
}

// ── Main refresh ──
async function refreshAll() {
  const token = getToken();
  if (!token) {
    document.getElementById('auth-modal').style.display = 'flex';
    return;
  }
  document.getElementById('auth-modal').style.display = 'none';

  updateConnection('loading');
  let fetchErrors = 0;

  const results = await Promise.allSettled([
    apiFetch('/projects').catch(e => ({ _error: e.message })),
    apiFetch('/runs').catch(e => ({ _error: e.message }))
  ]);

  const projectsRaw = results[0].value || [];
  const runsRaw = results[1].value || [];

  results.forEach(r => {
    if (r.status === 'rejected' || (r.value && r.value._error)) fetchErrors++;
  });

  if (fetchErrors === 2) {
    updateConnection('error');
    showEmptyAll('Connection failed');
    return;
  }
  updateConnection(fetchErrors > 0 ? 'partial' : 'ok');

  allData.projects = toArray(projectsRaw);
  allData.runs = toArray(runsRaw);

  document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();

  renderSummary();
  if (currentView === 'timeline') renderTimeline(); else renderCycle();
}

function updateConnection(state) {
  const dot = document.getElementById('conn-dot');
  const label = document.getElementById('conn-status');
  dot.className = 'status-dot';
  switch (state) {
    case 'ok': dot.classList.add('ok'); label.textContent = 'Connected'; break;
    case 'loading': dot.classList.add('loading'); label.textContent = 'Refreshing'; break;
    case 'partial': dot.classList.add('warning'); label.textContent = 'Partial'; break;
    case 'error': dot.classList.add('err'); label.textContent = 'Error'; break;
  }
}

function showEmptyAll(msg) {
  document.getElementById('timeline-content').innerHTML = `<div class="empty">${msg}</div>`;
  document.getElementById('blockers-content').innerHTML = '';
  document.getElementById('cycle-content').innerHTML = `<div class="empty">${msg}</div>`;
}

// ── Summary bar ──
function renderSummary() {
  const runs = allData.runs;
  const projects = allData.projects;

  const counts = { ok: 0, running: 0, failed: 0, pending: 0, blocked: 0, unknown: 0 };
  runs.forEach(r => {
    const s = classifyStatus(field(r, 'status', 'state'));
    counts[s] = (counts[s] || 0) + 1;
  });

  const total = runs.length;
  const okPct = total ? Math.round(counts.ok / total * 100) : 0;

  document.getElementById('summary-bar').innerHTML = `
    <div class="metric-card">
      <div class="label">Projects</div>
      <div class="value accent">${projects.length}</div>
    </div>
    <div class="metric-card">
      <div class="label">Total Runs</div>
      <div class="value">${total}</div>
    </div>
    <div class="metric-card">
      <div class="label">Active</div>
      <div class="value accent">${counts.running + counts.pending}</div>
    </div>
    <div class="metric-card">
      <div class="label">Blocked / Failed</div>
      <div class="value red">${counts.failed + counts.blocked}</div>
    </div>
    <div class="metric-card">
      <div class="label">Success Rate</div>
      <div class="value ${okPct >= 80 ? 'green' : okPct >= 50 ? 'yellow' : 'red'}">${okPct}%</div>
    </div>
    <div class="metric-card">
      <div class="label">Completed</div>
      <div class="value green">${counts.ok}</div>
    </div>
  `;
}

// ── TIMELINE VIEW ──
function renderTimeline() {
  const { projects, runs } = allData;
  const el = document.getElementById('timeline-content');
  const blockersEl = document.getElementById('blockers-content');

  if (!runs.length) {
    el.innerHTML = '<div class="empty">No runs found</div>';
    blockersEl.innerHTML = '';
    return;
  }

  // Group runs by project
  const projectKey = runs.length ? (Object.keys(runs[0]).find(k => /project/i.test(k))) : null;
  const groups = {};
  runs.forEach(r => {
    const pName = projectKey ? (r[projectKey] || 'Unassigned') : 'Unassigned';
    if (!groups[pName]) groups[pName] = [];
    groups[pName].push(r);
  });

  // Also include projects with no runs
  const projNameKey = projects.length ? (Object.keys(projects[0]).find(k => /name/i.test(k))) : null;
  projects.forEach(p => {
    const name = projNameKey ? p[projNameKey] : 'Unknown';
    if (!groups[name]) groups[name] = [];
  });

  let html = '';
  const blockers = [];

  for (const [projName, projRuns] of Object.entries(groups)) {
    const total = projRuns.length;
    if (!total) {
      html += `<div class="project-block">
        <div class="project-block-header">
          <span class="project-name">${esc(projName)}</span>
          <span class="project-stats"><span style="color:var(--muted)">No runs</span></span>
        </div>
      </div>`;
      continue;
    }

    const ok = projRuns.filter(r => classifyStatus(field(r, 'status', 'state')) === 'ok').length;
    const failed = projRuns.filter(r => classifyStatus(field(r, 'status', 'state')) === 'failed').length;
    const blocked = projRuns.filter(r => classifyStatus(field(r, 'status', 'state')) === 'blocked').length;
    const running = projRuns.filter(r => classifyStatus(field(r, 'status', 'state')) === 'running').length;
    const pending = projRuns.filter(r => classifyStatus(field(r, 'status', 'state')) === 'pending').length;
    const pct = Math.round(ok / total * 100);

    let barClass = 'project-progress-fill';
    if (failed > 0 || blocked > 0) barClass += ' has-fails';
    else if (running > 0 || pending > 0) barClass += ' has-blocks';

    html += `<div class="project-block">
      <div class="project-block-header" onclick="toggleProject(this)">
        <span class="project-name">${esc(projName)}</span>
        <span class="project-stats">
          <span style="color:var(--green)">&#x2714; ${ok}</span>
          <span style="color:var(--red)">&#x2718; ${failed + blocked}</span>
          <span style="color:var(--accent)">&#x25B6; ${running}</span>
          <span style="color:var(--muted)">&#x25CB; ${pending}</span>
          <span>${pct}%</span>
        </span>
      </div>
      <div class="project-progress"><div class="${barClass}" style="width:${pct}%"></div></div>
      <div class="run-timeline">`;

    projRuns.forEach(r => {
      const status = field(r, 'status', 'state') || 'unknown';
      const cls = classifyStatus(status);
      const name = field(r, 'name', 'title') || `Run ${field(r, 'id', 'run_id')}`;
      const id = field(r, 'id', 'run_id') || '';
      const started = field(r, 'started_at', 'created_at', 'start', 'created');
      const workflow = field(r, 'workflow', 'workflow_name') || '';
      const barPct = cls === 'ok' ? 100 : cls === 'running' ? 60 : cls === 'pending' ? 10 : cls === 'failed' ? 100 : 50;

      if (cls === 'failed' || cls === 'blocked') {
        blockers.push({ project: projName, name, id, status, started, reason: field(r, 'error', 'message', 'reason') || status });
      }

      html += `<div class="run-row">
        <div class="run-name">${esc(name)}${workflow ? `<small>${esc(workflow)}</small>` : ''}</div>
        <div class="run-bar-container">
          <div class="run-bar ${cls}" style="width:${barPct}%">
            <div class="run-bar-label">${cls === 'running' ? 'Running' : cls === 'pending' ? 'Pending' : cls === 'failed' ? 'Failed' : cls === 'ok' ? '' : esc(status)}</div>
          </div>
        </div>
        <div class="run-status">${pill(status)}</div>
        <div class="run-time">${timeAgo(started)}</div>
      </div>`;
    });

    html += `</div></div>`;
  }

  el.innerHTML = html;

  // Render blockers
  if (blockers.length) {
    blockersEl.innerHTML = `<h2>&#x26A0; Blockers & Failures (${blockers.length})</h2>` +
      blockers.map(b => `<div class="blocker-card ${classifyStatus(b.status) === 'blocked' ? 'warn' : ''}">
        <div class="blocker-project">${esc(b.project)}</div>
        <div class="blocker-run"><strong>${esc(b.name)}</strong> ${statusBadge(b.status)}</div>
        <div class="blocker-reason">${esc(b.reason)}</div>
        <div class="blocker-time">${timeAgo(b.started)}</div>
      </div>`).join('');
  } else {
    blockersEl.innerHTML = '';
  }
}

function toggleProject(header) {
  const timeline = header.nextElementSibling.nextElementSibling;
  if (timeline) timeline.style.display = timeline.style.display === 'none' ? '' : 'none';
}

// ── CYCLE VIEW ──
function renderCycle() {
  const { runs } = allData;
  const el = document.getElementById('cycle-content');

  if (!runs.length) {
    el.innerHTML = '<div class="empty">No runs found</div>';
    return;
  }

  // Group runs by time period
  const now = Date.now();
  const cycles = { 'Today': [], 'Yesterday': [], 'This Week': [], 'Last Week': [], 'This Month': [], 'Older': [] };

  const dayMs = 86400000;
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayTs = todayStart.getTime();
  const yesterdayStart = todayTs - dayMs;
  const weekStart = todayTs - (todayStart.getDay() * dayMs);
  const lastWeekStart = weekStart - 7 * dayMs;
  const monthStart = new Date(todayStart.getFullYear(), todayStart.getMonth(), 1).getTime();

  runs.forEach(r => {
    const started = field(r, 'started_at', 'created_at', 'start', 'created');
    const ts = started ? new Date(started).getTime() : 0;
    if (ts >= todayTs) cycles['Today'].push(r);
    else if (ts >= yesterdayStart) cycles['Yesterday'].push(r);
    else if (ts >= weekStart) cycles['This Week'].push(r);
    else if (ts >= lastWeekStart) cycles['Last Week'].push(r);
    else if (ts >= monthStart) cycles['This Month'].push(r);
    else cycles['Older'].push(r);
  });

  let html = '';
  const projectKey = runs.length ? (Object.keys(runs[0]).find(k => /project/i.test(k))) : null;

  for (const [cycle, cycleRuns] of Object.entries(cycles)) {
    if (!cycleRuns.length) continue;

    const ok = cycleRuns.filter(r => classifyStatus(field(r, 'status', 'state')) === 'ok').length;
    const failed = cycleRuns.filter(r => classifyStatus(field(r, 'status', 'state')) === 'failed').length;
    const running = cycleRuns.filter(r => classifyStatus(field(r, 'status', 'state')) === 'running').length;
    const total = cycleRuns.length;

    html += `<div class="project-block">
      <div class="project-block-header">
        <span class="project-name">${cycle}</span>
        <span class="project-stats">
          <span>${total} runs</span>
          <span style="color:var(--green)">${ok} done</span>
          <span style="color:var(--accent)">${running} active</span>
          <span style="color:var(--red)">${failed} failed</span>
        </span>
      </div>
      <div style="overflow-x:auto">
      <table class="cycle-table">
        <thead><tr>
          <th>Run</th><th>Project</th><th>Status</th><th>Workflow</th><th>Started</th>
        </tr></thead>
        <tbody>`;

    cycleRuns.forEach(r => {
      const name = field(r, 'name', 'title') || '-';
      const status = field(r, 'status', 'state') || '-';
      const project = projectKey ? r[projectKey] : '-';
      const workflow = field(r, 'workflow', 'workflow_name') || '-';
      const started = field(r, 'started_at', 'created_at', 'start', 'created');

      html += `<tr>
        <td><strong>${esc(name)}</strong></td>
        <td>${esc(project)}</td>
        <td>${statusBadge(status)}</td>
        <td style="color:var(--muted)">${esc(workflow)}</td>
        <td style="color:var(--muted)">${timeAgo(started)}</td>
      </tr>`;
    });

    html += `</tbody></table></div></div>`;
  }

  el.innerHTML = html || '<div class="empty">No runs to display</div>';
}

// ── Init ──
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveToken();
});

if (getToken()) {
  probeToken(getToken()).then(valid => {
    if (valid) {
      document.getElementById('auth-modal').style.display = 'none';
      refreshAll();
    } else {
      document.getElementById('auth-error').textContent = 'Stored token is invalid. Please re-enter.';
      document.getElementById('auth-error').style.display = 'block';
    }
  });
}

setInterval(refreshAll, REFRESH_INTERVAL);
</script>
