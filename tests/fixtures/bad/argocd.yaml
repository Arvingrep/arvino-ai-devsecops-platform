# Negative control: production auto-sync and wildcard project permissions.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: x-production, namespace: argocd}
spec:
  project: p
  source: {repoURL: "https://example.invalid/r.git", path: p, targetRevision: main}
  destination: {server: "https://kubernetes.default.svc", namespace: x}
  syncPolicy: {automated: {prune: true}}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: p, namespace: argocd}
spec:
  clusterResourceWhitelist: [{group: "*", kind: "*"}]
  destinations: [{server: "*", namespace: "*"}]
