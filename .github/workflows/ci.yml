name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  IMAGE: asia-southeast1-docker.pkg.dev/fh580-70533/containers/arvino
  WIF_PROVIDER: projects/962691151362/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc
  WIF_SA: github-cicd-deployer@fh580-70533.iam.gserviceaccount.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python + dependencies
        run: |
          uv python install 3.12
          uv sync --all-extras

      - name: Install tools
        run: |
          uv tool install ruff
          uv tool install mypy
          curl -fsSL https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static -o /usr/local/bin/opa && chmod +x /usr/local/bin/opa
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.58.0/conftest_0.58.0_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin conftest
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.59.1

      - name: Ruff lint + format
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: mypy --strict
        run: uv run mypy

      - name: yamllint
        run: uv run yamllint -s .

      - name: Validate workflow definitions
        run: uv run arvino validate-workflows

      - name: pytest
        run: uv run pytest -q --tb=short

      - name: OPA policy tests
        run: |
          opa check --strict policy/
          opa test policy/

      - name: Kustomize + conftest
        run: |
          for env in dev staging production; do
            kubectl kustomize deploy/overlays/$env > /tmp/$env.yaml
            conftest test --no-color --policy policy/k8s --namespace k8s.workloads --namespace k8s.nosecrets /tmp/$env.yaml
          done
          conftest test --no-color --policy policy/k8s --namespace k8s.secrets deploy/secrets-examples/
          conftest test --no-color --policy policy/k8s --namespace k8s.argocd deploy/argocd/appproject.yaml deploy/argocd/applications.yaml

      - name: Negative controls
        run: |
          ! conftest test --no-color --policy policy/k8s --namespace k8s.workloads tests/fixtures/bad/deployment.yaml
          ! conftest test --no-color --policy policy/k8s --namespace k8s.secrets tests/fixtures/bad/secret.yaml
          ! conftest test --no-color --policy policy/k8s --namespace k8s.argocd tests/fixtures/bad/argocd.yaml

      - name: Gitleaks
        run: gitleaks git --no-banner --redact -c .gitleaks.toml .

      - name: Trivy config scan (IaC)
        run: |
          trivy config --severity HIGH,CRITICAL --format sarif --output trivy-config.sarif deploy/

      - name: Upload Trivy config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Upload Trivy config artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-sarif
          path: trivy-config.sarif
          retention-days: 30

      - uses: azure/setup-kubectl@v4

  build:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.59.1

      - name: Build image
        run: |
          SHA=${GITHUB_SHA::12}
          docker build -t $IMAGE:$SHA -t $IMAGE:latest .
          echo "SHA=$SHA" >> $GITHUB_ENV

      - name: Trivy image scan
        run: |
          trivy image --severity HIGH,CRITICAL --format sarif --output trivy-image.sarif $IMAGE:${{ env.SHA }}

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload Trivy image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 30

      - name: Push image
        run: |
          docker push $IMAGE:${{ env.SHA }}
          docker push $IMAGE:latest
          echo "Pushed $IMAGE:${{ env.SHA }}"
