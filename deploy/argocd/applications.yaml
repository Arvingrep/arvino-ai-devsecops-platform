# Argo CD Applications. dev/staging auto-sync; PRODUCTION HAS NO automated sync (owner syncs manually
# after approving the promotion PR). Agents never hold Argo CD credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arvino-dev
  namespace: argocd
  annotations: {arvino.dev/environment: dev}
spec:
  project: arvino
  source:
    repoURL: https://git.example.invalid/arvino/ai-devsecops-platform.git # REPLACE
    targetRevision: main
    path: deploy/overlays/dev
  destination: {server: https://kubernetes.default.svc, namespace: arvino-dev}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arvino-staging
  namespace: argocd
  annotations: {arvino.dev/environment: staging}
spec:
  project: arvino
  source:
    repoURL: https://git.example.invalid/arvino/ai-devsecops-platform.git # REPLACE
    targetRevision: main
    path: deploy/overlays/staging
  destination: {server: https://kubernetes.default.svc, namespace: arvino-staging}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arvino-production
  namespace: argocd
  annotations: {arvino.dev/environment: production}
spec:
  project: arvino
  source:
    repoURL: https://git.example.invalid/arvino/ai-devsecops-platform.git # REPLACE
    targetRevision: main
    path: deploy/overlays/production
  destination: {server: https://kubernetes.default.svc, namespace: arvino-production}
  # intentionally NO syncPolicy.automated
---
# Temporal from the upstream Helm chart; values live in this repo (secrets referenced, never inlined).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
spec:
  project: arvino
  sources:
    - repoURL: https://go.temporal.io/helm-charts
      chart: temporal
      targetRevision: 1.7.0
      helm:
        releaseName: temporal
        valueFiles: [$values/deploy/helm-values/temporal.yaml]
    - repoURL: https://git.example.invalid/arvino/ai-devsecops-platform.git # REPLACE
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: temporal}
  syncPolicy:
    syncOptions: [CreateNamespace=true]
---
# Plane (Community Edition) from the upstream Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane
  namespace: argocd
spec:
  project: arvino
  sources:
    - repoURL: https://helm.plane.so/
      chart: plane-ce
      targetRevision: 1.8.5
      helm:
        releaseName: plane-app
        valueFiles: [$values/deploy/helm-values/plane.yaml]
    - repoURL: https://git.example.invalid/arvino/ai-devsecops-platform.git # REPLACE
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: plane}
  syncPolicy:
    syncOptions: [CreateNamespace=true]
