# Dev/staging convenience database for the orchestrator ledger. Production overlay deletes this
# and points ARVINO_DATABASE_URL at a managed / operator-run PostgreSQL (backups, PITR).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arvino-postgres
  labels: {app.kubernetes.io/name: arvino-postgres}
spec:
  serviceName: arvino-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: arvino-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: arvino-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_USER, value: arvino}
            - {name: POSTGRES_DB, value: arvino}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: arvino-postgres, key: POSTGRES_PASSWORD, optional: false}}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "arvino", "-d", "arvino"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
