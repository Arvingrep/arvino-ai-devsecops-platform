apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels: {app.kubernetes.io/name: opa}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: opa}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opa}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: opa
          image: openpolicyagent/opa:1.21.2-static
          args: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "--watch", "/policy"]
          ports: [{name: http, containerPort: 8181}]
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: policy, mountPath: /policy, readOnly: true}
      volumes:
        - name: policy
          configMap: {name: opa-policy}
