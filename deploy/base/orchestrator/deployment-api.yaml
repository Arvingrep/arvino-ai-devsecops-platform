apiVersion: apps/v1
kind: Deployment
metadata:
  name: arvino-orchestrator
  labels: {app.kubernetes.io/name: arvino-orchestrator, app.kubernetes.io/component: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: arvino-orchestrator, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: arvino-orchestrator, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: arvino-orchestrator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/arvino/orchestrator:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: arvino-orchestrator-config}
            - secretRef: {name: arvino-orchestrator-secrets, optional: false}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
