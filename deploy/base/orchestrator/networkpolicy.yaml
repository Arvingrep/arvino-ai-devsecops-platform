# Default-deny for the namespace, then explicit allows. Adjust the ingress-controller namespace label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator-api
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: arvino-orchestrator, app.kubernetes.io/component: api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: opa}}}]
      ports: [{port: 8181}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: arvino-postgres}}}]
      ports: [{port: 5432}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: temporal}}}]
      ports: [{port: 7233}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator-worker
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: arvino-orchestrator, app.kubernetes.io/component: worker}
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: opa}}}]
      ports: [{port: 8181}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: arvino-postgres}}}]
      ports: [{port: 5432}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: temporal}}}]
      ports: [{port: 7233}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opa
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: opa}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: arvino-orchestrator}}
      ports: [{port: 8181}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: arvino-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: arvino-orchestrator}}
      ports: [{port: 5432}]
