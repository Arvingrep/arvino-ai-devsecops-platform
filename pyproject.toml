[project]
name = "arvino"
version = "0.1.0"
description = "Thin orchestration/control layer for the Arvino AI DevSecOps platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "alembic>=1.20.0",
  "python-jose[cryptography]>=3.5.0",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.7"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "yamllint>=1.35",
  "types-PyYAML",
]

[project.scripts]
arvino = "arvino.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arvino = ["workflows/definitions/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
  "opa: requires an `opa` binary (or ARVINO_OPA_BIN); skipped when absent",
  "temporal: requires the temporalio dev server; skipped when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "E501"]  # E501: `ruff format` owns code width; long strings/comments are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
